version: '3.8'

services:
  server:
    build:
      context: ./server/
      dockerfile: Dockerfile
    container_name: misa_server
    restart: unless-stopped
    ports:
      - "5001:8001"
    env_file:
      - ./server/.env
    depends_on:
      - misa-redis
    networks:
      - misa_net
  client:
    container_name: misa_client
    build:
      dockerfile: Dockerfile
      context: ./client/
      args:
        # Нужен: docker compose --env-file client/.env build
        REACT_APP_API_URL: ${REACT_APP_API_URL:-https://misaapi.baxic.ru}
        REACT_APP_API_WSS: ${REACT_APP_API_WSS:-}
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - misa_net
  smtp-service-misa:
    image: maildev/maildev
    container_name: smtp-service-misa
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--no-warnings=DeprecationWarning
      - DEBUG=maildev*
    env_file:
      - ./server/.env
    entrypoint:
      - /bin/sh
    command:
      - -c
      - 'exec node dist/bin/maildev.js --outgoing-host "$${SMTP_OUTGOING_HOST}" --outgoing-port "$${SMTP_OUTGOING_PORT}" --outgoing-secure --outgoing-user "$${SMTP_OUTGOING_USER}" --outgoing-pass "$${SMTP_OUTGOING_PASSWORD}" --auto-relay --verbose'
    ports:
      - "8191:1080"
      - "1025:1025"
    networks:
      - misa_net
  misa-redis:
    image: redis:7-alpine
    container_name: misa-redis
    restart: unless-stopped
    ports:
      - "6384:6379"
    networks:
      - misa_net

networks:
  misa_net:
    driver: bridge
