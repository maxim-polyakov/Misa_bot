name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build server test image
        run: docker build --file server/Dockerfile --tag misa-server-test server

      - name: Run server tests
        run: docker run --rm --entrypoint python misa-server-test tests_main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Create client .env from CLIENT_ENV
        env:
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
        run: |
          if [ -z "$CLIENT_ENV" ]; then
            echo "CLIENT_ENV secret is empty" >&2
            exit 1
          fi
          if ! printf '%s\n' "$CLIENT_ENV" | grep -q '^REACT_APP_API_URL='; then
            echo "CLIENT_ENV must contain REACT_APP_API_URL=..." >&2
            exit 1
          fi
          printf '%s\n' "$CLIENT_ENV" > client/.env

      - name: Check web client
        working-directory: client
        env:
          CI: "true"
        run: |
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          npm ci
          npm test -- --watchAll=false
          CI=false npm run build
          # убеждаемся, что API URL реально вшит в бандл
          grep -R -l "misaapi" build/static/js/*.js >/dev/null

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy project to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "client,server,scripts,docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Build project on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # .env пишем на сервере: scp часто не копирует dotfiles / gitignore
          envs: DEPLOY_PATH,SERVER_ENV,CLIENT_ENV
          script_stop: true
          command_timeout: 60m
          script: |
            cd "$DEPLOY_PATH"
            if [ -z "$SERVER_ENV" ]; then echo "SERVER_ENV empty" >&2; exit 1; fi
            if [ -z "$CLIENT_ENV" ]; then echo "CLIENT_ENV empty" >&2; exit 1; fi
            if ! printf '%s\n' "$CLIENT_ENV" | grep -q '^REACT_APP_API_URL='; then
              echo "CLIENT_ENV must contain REACT_APP_API_URL=..." >&2
              exit 1
            fi
            printf '%s\n' "$SERVER_ENV" > server/.env
            printf '%s\n' "$CLIENT_ENV" > client/.env
            # Compose собирает образы, production-контейнеры запускает k3s.
            # Helper импортирует образы в локальный containerd и ждёт rollout.
            bash "$DEPLOY_PATH/scripts/compose-k3s-sync.sh" \
              --project-dir "$DEPLOY_PATH" \
              --env-file client/.env \
              --no-cache
